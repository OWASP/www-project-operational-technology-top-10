---
# Pandoc + Eisvogel metadata for the combined OWASP OT Top 10 PDF.
# See https://github.com/Wandmalfarbe/pandoc-latex-template for the variables.
title: "OWASP OT Top 10"
subtitle: "The Top 10 Operational Technology Security Risks"
# date / footer-left carry the edition year and are passed by pdf/build.sh
lang: en

# Number only the ten risk chapters, two levels deep (1, 1.1, 1.2 ...).
# assemble.py marks every other heading `.unnumbered`.
numbersections: true
secnumdepth: 2

# Eisvogel title page — palette taken from the IT SecX 2025 title slide
# (light #F5F7FC ground, green #13A10E / blue #1D7BD7 accents, dark text).
titlepage: true
titlepage-color: "F5F7FC"
titlepage-text-color: "1B2733"
# rule-height 0: Eisvogel draws the rule wider than our text block, so it
# overshoots the page edge by ~4mm; without it the title page stays clean.
titlepage-rule-color: "1D7BD7"
titlepage-rule-height: 0
# Emblem: pdf/build.sh rasterises pdf/assets/ot-top10-logo.svg -> /work/logo.pdf
titlepage-logo: "/work/logo.pdf"
logo-width: "60mm"

# Table of contents
toc: true
toc-own-page: true
toc-depth: 2

# Links (otteal is defined in header-includes below so hyperref can use it)
colorlinks: true
linkcolor: otteal
urlcolor: otteal
toccolor: otteal
# header-includes is parsed as markdown, so keep it to bare LaTeX commands
# (a "%" comment in here ends up as text and breaks the preamble).
# bookmarksnumbered puts the section numbers into the PDF outline as well, so
# the ten risks read "1 Unknown Assets ..." in the bookmark pane, not just in
# the table of contents.
# The running head's outer slot shows the current chapter (assemble.py emits a
# \markright per chapter); the edition stays in the footer.
header-right: "\\rightmark"

header-includes: |
  \definecolor{otteal}{HTML}{1D7BD7}
  \hypersetup{bookmarksnumbered=true,bookmarksopen=true,bookmarksopenlevel=1}
  \setkomafont{subsubsection}{\normalsize\bfseries\itshape}
  \setkomafont{paragraph}{\normalsize\itshape}
  \emergencystretch=3em
  \lefthyphenmin=3
  \widowpenalty=10000
  \clubpenalty=10000
  \usepackage{enumitem}
  \setlist{topsep=4pt,itemsep=2pt,parsep=0pt}
  \AtBeginDocument{\captionsetup{skip=6pt,belowskip=2pt}}

# Tables / code / layout
table-use-row-colors: true
code-block-font-size: "\\small"
# 3.0cm side margins give a ~90-characters-per-line measure - the compromise
# between the old 2.2cm (~103 characters, hard to read, strained justification)
# and the bookish 3.6cm, which looked too airy.
geometry: "a4paper,left=3cm,right=3cm,top=2.5cm,bottom=2.7cm"
...
