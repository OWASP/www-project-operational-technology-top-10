name: CI pipeline
on:
  push:
  workflow_dispatch:

# for security reasons the github actions are pinned to specific release versions
jobs:
  link_checker:
    name: Link checker
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout markdown
        uses: actions/checkout@v7

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 5 './docs/**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  md_linter:
    name: Lint markdown
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout markdown
        uses: actions/checkout@v7

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v23.2.0
        with:
          config: '.markdownlint.yaml'
          globs: './docs/**/*.md'

  pdf_structure:
    name: PDF structure
    runs-on: ubuntu-24.04
    # Assembling needs no Docker and takes a second. It catches the mistakes the
    # deploy-time PDF build would otherwise catch too late: a page renamed or
    # added without updating PARTS in pdf/assemble.py.
    steps:
      - name: Checkout markdown
        uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Every edition assembles, with no missing or unlisted page
        run: |
          set -euo pipefail
          editions=$(find docs/v -mindepth 1 -maxdepth 1 -type d \
            -regex '.*/[0-9][0-9][0-9][0-9]' -printf '%f\n' | sort)
          [ -n "$editions" ] || { echo "no docs/v/<year>/ edition found"; exit 1; }
          for edition in $editions; do
            python3 pdf/assemble.py docs "$RUNNER_TEMP/assembled-$edition.md" \
              "$edition" --strict
          done

